<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Water rocket simulator</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eaf2fb;--card:#fff;--ink:#12263f;--mut:#5b6f88;--line:#d3e0ef;--acc:#1668d9;--acc2:#0f9d58;--sky1:#9fd0f5;--sky2:#e3f3ff;--grass:#7bb661;--hud:#ffffffd9}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1824;--card:#16253a;--ink:#e6eef8;--mut:#93a8c2;--line:#2a3d57;--acc:#4b94ff;--acc2:#35c27a;--sky1:#27557f;--sky2:#7ab4e0;--grass:#3f7a3a;--hud:#16253ad9}}
:root[data-theme="dark"]{--bg:#0e1824;--card:#16253a;--ink:#e6eef8;--mut:#93a8c2;--line:#2a3d57;--acc:#4b94ff;--acc2:#35c27a;--sky1:#27557f;--sky2:#7ab4e0;--grass:#3f7a3a;--hud:#16253ad9}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 "Trebuchet MS","Segoe UI",system-ui,sans-serif}
.app{max-width:1100px;margin:0 auto;padding:14px;display:grid;grid-template-columns:260px 1fr;gap:14px}
@media(max-width:820px){.app{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
h2{font-size:13px;margin:0 0 8px;color:#fff;background:var(--acc);padding:6px 10px;border-radius:6px 6px 0 0;margin:-12px -12px 10px}
h3{font-size:14px;margin:0 0 6px}
.row{margin-bottom:9px}.row label{display:flex;justify-content:space-between;align-items:center;font-size:12px;gap:6px}
.row input[type=number]{width:62px;padding:2px 4px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);text-align:right}
.row input[type=range]{width:100%;accent-color:var(--acc);margin:2px 0 0}
.mm{display:flex;justify-content:space-between;font-size:10px;color:var(--mut)}
button,select{font:inherit;border-radius:6px;border:1px solid var(--line);padding:8px 10px;background:var(--card);color:var(--ink);cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.go{background:var(--acc);color:#fff;border-color:var(--acc);width:100%;font-weight:700}
.go.g{background:var(--acc2);border-color:var(--acc2)}
.btns{display:grid;grid-template-columns:1fr;gap:8px;margin-top:6px}
.stage{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--card)}
.stage .t{background:var(--acc);color:#fff;font-weight:700;padding:6px 10px;font-size:13px}
#cv{width:100%;height:300px;display:block}
.hud{position:absolute;right:10px;top:42px;background:var(--hud);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:12px;line-height:1.5;min-width:130px}
.hud b{display:inline-block;width:62px;color:var(--mut);font-weight:400}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
@media(max-width:600px){.cards{grid-template-columns:repeat(2,1fr)}}
.k{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px;text-align:center}
.k span{font-size:12px;color:var(--mut)}.k b{display:block;font-size:20px;color:var(--acc)}
.graphs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
@media(max-width:700px){.graphs{grid-template-columns:1fr}}
.graphs .k{text-align:left;padding:6px}.graphs h3{font-size:12px;margin:0}
.graphs canvas,.sw canvas{width:100%;height:150px;display:block}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
@media(max-width:700px){.modes{grid-template-columns:1fr}}
.sw{display:grid;grid-template-columns:150px 1fr;gap:10px}
@media(max-width:520px){.sw{grid-template-columns:1fr}}
.best{font-size:12px;line-height:1.6}.best b{color:var(--acc2)}
.best div{display:flex;justify-content:space-between;max-width:230px}
.sub{color:var(--mut);font-size:12px;margin:0 0 8px}
</style></head><body>
<div class="app">
<aside>
 <div class="panel" id="inp"><h2>Input parameters</h2><div id="sl"></div>
  <div class="btns"><button class="go" id="launch">▶ Launch</button><button id="reset">Reset</button></div>
 </div>
</aside>
<main>
 <div class="stage"><div class="t">Water rocket simulator</div>
  <canvas id="cv"></canvas>
  <div class="hud" id="hud"></div></div>
 <div class="cards">
  <div class="k"><span>Maximum height</span><b id="rH">–</b></div>
  <div class="k"><span>Range</span><b id="rR">–</b></div>
  <div class="k"><span>Maximum velocity</span><b id="rV">–</b></div>
  <div class="k"><span>Flight time</span><b id="rT">–</b></div>
 </div>
 <div class="graphs">
  <div class="k"><h3>Height vs. time</h3><canvas id="g1"></canvas></div>
  <div class="k"><h3>Velocity vs. time</h3><canvas id="g2"></canvas></div>
  <div class="k"><h3>Thrust vs. time</h3><canvas id="g3"></canvas></div>
 </div>
 <div class="modes">
  <div class="panel"><h2>Experiment mode</h2><p class="sub">Study one variable at a time (maximum height).</p>
   <div class="sw"><div><div class="row"><label>Variable</label><select id="sv" style="width:100%"></select></div>
   <button class="go" id="sweep">Run sweep</button></div><canvas id="g4"></canvas></div></div>
  <div class="panel"><h2>Optimization mode</h2><p class="sub">Find the best configuration.</p>
   <div class="row"><label>Objective <select id="obj"><option value="maxH">Maximum height</option><option value="range">Range</option><option value="maxV">Maximum velocity</option></select></label></div>
   <div class="row"><label>Iterations <input type="number" id="its" value="300" min="20" max="2000"></label></div>
   <button class="go g" id="opt">🔍 Find optimum</button>
   <div class="best" id="best" style="margin-top:8px"></div></div>
 </div>
</main></div>
<script>
const P=[["p","Initial air pressure (bar)",1,9,.1,5],["vw","Initial water volume (L)",.2,2.2,.05,1.2],["vt","Bottle volume (L)",1.5,3,.05,2],["ms","Dry mass (kg)",.05,.5,.01,.15],["dn","Nozzle diameter (mm)",5,20,.5,10],["dr","Rocket diameter (mm)",70,140,1,100],["cd","Drag coefficient (Cd)",.1,1,.01,.4],["th","Launch angle (°)",10,80,1,45]];
const $=id=>document.getElementById(id);
const q={};P.forEach(r=>q[r[0]]=r[5]);
const sl=$("sl"),sv=$("sv");
P.forEach(([k,l,a,b,s])=>{
 sl.insertAdjacentHTML("beforeend",`<div class="row"><label>${l}<input type="number" id="n_${k}" min="${a}" max="${b}" step="${s}"></label><input type="range" id="r_${k}" min="${a}" max="${b}" step="${s}" aria-label="${l}"><div class="mm"><span>${a}</span><span>${b}</span></div></div>`);
 sv.insertAdjacentHTML("beforeend",`<option value="${k}">${l}</option>`);
 const set=v=>{v=Math.min(b,Math.max(a,+v));q[k]=v;$("n_"+k).value=v;$("r_"+k).value=v};
 $("n_"+k).oninput=e=>{if(e.target.value!=="")set(e.target.value);};
 $("r_"+k).oninput=e=>set(e.target.value);set(q[k]);
});
function syncUI(){P.forEach(([k])=>{$("n_"+k).value=+q[k].toFixed(2);$("r_"+k).value=q[k]})}

// ---- Modelo físico (agua → aire adiabático → balístico con arrastre) ----
function sim(c){
 const g=9.81,pa=101325,rho=1000,gam=1.4,R=287,T0=293,ra=1.2,dt=.002;
 const Vt=c.vt/1e3,Vw0=Math.min(c.vw,c.vt-.05)/1e3,Ae=Math.PI*(c.dn/2e3)**2,Ab=Math.PI*(c.dr/2e3)**2;
 const P0=c.p*1e5+pa,Va0=Vt-Vw0,th=c.th*Math.PI/180;
 let Vw=Vw0,x=0,y=0,vx=0,vy=0,ph=0,t=0,pe,ma,ma0,n=0;
 const o={t:[],x:[],y:[],v:[],T:[],ph:[],maxH:0,range:0,maxV:0,tf:0};
 while(t<60){
  const sp=Math.hypot(vx,vy),dx=sp>1?vx/sp:Math.cos(th),dy=sp>1?vy/sp:Math.sin(th);
  let T=0,p;
  if(ph==0){
   p=P0*(Va0/(Vt-Vw))**gam;
   if(p<=pa)ph=2;else{
    const ve=Math.sqrt(2*(p-pa)/(rho*(1-(Ae/Ab)**2)));T=rho*Ae*ve*ve;Vw-=Ae*ve*dt;
    if(Vw<=0){Vw=0;pe=P0*(Va0/Vt)**gam;if(pe<=pa*1.001)ph=2;else{ph=1;const Tw=T0*(pe/P0)**((gam-1)/gam);ma0=ma=pe/(R*Tw)*Vt}}
   }
  }
  if(ph==1){
   p=pe*(ma/ma0)**gam;const rg=ma/Vt,Tg=p/(rg*R);
   if(p<=pa*1.001)ph=2;else{
    const ve=Math.sqrt(2*gam/(gam-1)*R*Tg*(1-(pa/p)**((gam-1)/gam)));
    const md=p/pa>1.893?Ae*p*Math.sqrt(gam/(R*Tg))*.5787:Ae*rg*(pa/p)**(1/gam)*ve;
    T=md*ve;ma-=md*dt;if(ma<=0)ph=2;
   }
  }
  const m=c.ms+rho*Vw+(ph<2&&ma?ma:0),D=.5*ra*c.cd*Ab*sp*sp;
  vx+=(T-D)*dx/m*dt;vy+=((T-D)*dy/m-g)*dt;x+=vx*dt;y+=vy*dt;t+=dt;
  if(y<0&&(ph<2&&t<.5||T>0)){y=0;vy=Math.max(vy,0)}
  const s2=Math.hypot(vx,vy);if(s2>o.maxV)o.maxV=s2;if(y>o.maxH)o.maxH=y;
  if(n++%10==0){o.t.push(t);o.x.push(x);o.y.push(y);o.v.push(s2);o.T.push(T);o.ph.push(ph)}
  if(y<0&&ph==2&&t>.1){o.range=x;o.tf=t;break}
 }
 if(!o.tf){o.tf=t;o.range=x}
 return o;
}

// ---- Gráficas ----
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function setup(cv){const d=devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;cv.width=w*d;cv.height=h*d;const c=cv.getContext("2d");c.setTransform(d,0,0,d,0,0);return[c,w,h]}
function chart(id,xs,ys,col,xl,yl,dots){
 const[c,w,h]=setup($(id));c.clearRect(0,0,w,h);if(!xs.length)return;
 const L=38,B=22,Tp=8,Rr=8,xm=Math.max(...xs),xn=dots?Math.min(...xs):0,ym=Math.max(...ys,1e-6)*1.08,yn=dots?Math.min(0,...ys):0;
 const X=v=>L+(v-xn)/(xm-xn||1)*(w-L-Rr),Y=v=>h-B-(v-yn)/(ym-yn||1)*(h-B-Tp);
 c.strokeStyle=css("--line");c.fillStyle=css("--mut");c.font="10px sans-serif";c.lineWidth=1;
 for(let i=0;i<=4;i++){const v=yn+(ym-yn)*i/4,yy=Y(v);c.beginPath();c.moveTo(L,yy);c.lineTo(w-Rr,yy);c.stroke();c.textAlign="right";c.fillText(v>=100?v.toFixed(0):v.toFixed(1),L-4,yy+3)}
 c.textAlign="center";for(let i=0;i<=4;i++){const v=xn+(xm-xn)*i/4;c.fillText(v.toFixed(xm>20?0:1),X(v),h-B+12)}
 c.fillText(xl,(w+L)/2,h-2);c.save();c.translate(9,h/2);c.rotate(-Math.PI/2);c.fillText(yl,0,0);c.restore();
 c.strokeStyle=col;c.fillStyle=col;c.lineWidth=2;c.beginPath();xs.forEach((v,i)=>i?c.lineTo(X(v),Y(ys[i])):c.moveTo(X(v),Y(ys[i])));c.stroke();
 if(dots)xs.forEach((v,i)=>{c.beginPath();c.arc(X(v),Y(ys[i]),3,0,7);c.fill()});
}

// ---- Animación ----
const PH=["Water thrust","Air thrust","Ballistic"];
let cur=null,t0=0,raf=0,scale=1;
function stats(o){$("rH").textContent=o.maxH.toFixed(1)+" m";$("rR").textContent=o.range.toFixed(1)+" m";$("rV").textContent=o.maxV.toFixed(1)+" m/s";$("rT").textContent=o.tf.toFixed(1)+" s";
 chart("g1",o.t,o.y,"#0f9d58","Time (s)","Height (m)");chart("g2",o.t,o.v,"#e0352b","Time (s)","Vel. (m/s)");chart("g3",o.t,o.T,"#1668d9","Time (s)","Thrust (N)")}
function hud(i){const o=cur;$("hud").innerHTML=`<b>Time:</b>${o.t[i].toFixed(2)} s<br><b>Height:</b>${o.y[i].toFixed(1)} m<br><b>Velocity:</b>${o.v[i].toFixed(1)} m/s<br><b>Thrust:</b>${o.T[i].toFixed(0)} N<br><b>Phase:</b>${PH[o.ph[i]]}`}
function draw(i,parts){
 const[c,w,h]=setup($("cv")),o=cur,gy=h-34,ox=40;
 const gr=c.createLinearGradient(0,0,0,gy);gr.addColorStop(0,css("--sky1"));gr.addColorStop(1,css("--sky2"));c.fillStyle=gr;c.fillRect(0,0,w,h);
 c.fillStyle=css("--grass");c.fillRect(0,gy,w,h-gy);
 if(!o){c.fillStyle=css("--ink");c.font="14px sans-serif";c.textAlign="center";c.fillText("Adjust the parameters and press Launch",w/2,h/2);return}
 scale=Math.min((w-ox-40)/Math.max(o.range,10),(gy-30)/Math.max(o.maxH,5));
 const X=v=>ox+v*scale,Y=v=>gy-v*scale;
 c.setLineDash([6,5]);c.strokeStyle="#1668d9";c.lineWidth=1.5;c.beginPath();o.x.forEach((v,k)=>k?c.lineTo(X(v),Y(o.y[k])):c.moveTo(X(v),Y(o.y[k])));c.stroke();c.setLineDash([]);
 const ia=o.y.indexOf(o.maxH);c.fillStyle="#e0352b";c.beginPath();c.arc(X(o.x[ia]),Y(o.y[ia]),4,0,7);c.fill();
 c.fillStyle="#555";c.fillRect(ox-3,gy-8,6,8);
 parts.forEach(p=>{c.fillStyle=`rgba(190,230,255,${p.l})`;c.beginPath();c.arc(X(p.x),Y(p.y),2.5,0,7);c.fill()});
 const j=Math.min(i+1,o.x.length-1),ang=Math.atan2(o.y[j]-o.y[i],o.x[j]-o.x[i]),rx=X(o.x[i]),ry=Y(o.y[i]);
 c.save();c.translate(rx,ry);c.rotate(-(i>1&&o.v[i]>1?ang:+q.th*Math.PI/180));
 c.fillStyle="#e0352b";c.beginPath();c.moveTo(14,0);c.lineTo(4,-4);c.lineTo(4,4);c.fill();
 c.fillStyle="#cfe8ff";c.strokeStyle="#1668d9";c.lineWidth=1.2;c.beginPath();c.roundRect(-10,-4,14,8,3);c.fill();c.stroke();
 c.fillStyle="#e0352b";c.beginPath();c.moveTo(-10,0);c.lineTo(-15,-7);c.lineTo(-6,-4);c.moveTo(-10,0);c.lineTo(-15,7);c.lineTo(-6,4);c.fill();c.restore();
}
function launch(){
 cancelAnimationFrame(raf);cur=sim(q);stats(cur);t0=performance.now();let parts=[];
 const step=now=>{
  const st=(now-t0)/1000;let i=Math.min(cur.t.findIndex(v=>v>=st),cur.t.length-1);if(i<0)i=cur.t.length-1;
  if(cur.ph[i]<2&&cur.T[i]>0){const a=Math.atan2(cur.y[Math.min(i+1,cur.y.length-1)]-cur.y[i],cur.x[Math.min(i+1,cur.x.length-1)]-cur.x[i]);
   for(let k=0;k<3;k++)parts.push({x:cur.x[i]-Math.cos(a)*(.2+Math.random()*.6)/scale*8,y:cur.y[i]-Math.sin(a)*(.2+Math.random()*.6)/scale*8+(Math.random()-.5)*.6/scale*6,l:1})}
  parts.forEach(p=>p.l-=.03);parts=parts.filter(p=>p.l>0);
  draw(i,parts);hud(i);if(st<=cur.tf+.2)raf=requestAnimationFrame(step);
 };raf=requestAnimationFrame(step);
}
$("launch").onclick=launch;
$("reset").onclick=()=>{cancelAnimationFrame(raf);P.forEach(r=>q[r[0]]=r[5]);syncUI();cur=null;draw(0,[]);["rH","rR","rV","rT"].forEach(k=>$(k).textContent="–");$("hud").innerHTML="Ready to launch";["g1","g2","g3","g4"].forEach(g=>setup($(g)));$("best").innerHTML=""};

// ---- Experimento ----
$("sweep").onclick=()=>{
 const k=sv.value,r=P.find(p=>p[0]==k),N=14,xs=[],ys=[];
 for(let i=0;i<N;i++){const v=r[2]+(r[3]-r[2])*i/(N-1),c={...q,[k]:v};if(k=="vt"&&c.vw>v-.05)c.vw=v-.05;xs.push(v);ys.push(sim(c).maxH)}
 chart("g4",xs,ys,"#1668d9",r[1],"Max height (m)",true);
};

// ---- Optimización ----
let bestCfg=null;
$("opt").onclick=()=>{
 const key=$("obj").value,N=Math.min(2000,Math.max(20,+$("its").value||300));
 const clamp=(c)=>{P.forEach(([k,,a,b])=>c[k]=Math.min(b,Math.max(a,c[k])));c.vw=Math.min(c.vw,c.vt-.1);return c};
 let best=clamp({...q}),bs=sim(best)[key];
 for(let i=0;i<N;i++){
  const c={...best};
  P.forEach(([k,,a,b])=>{c[k]=i<N*.4?a+Math.random()*(b-a):best[k]+(Math.random()-.5)*(b-a)*.15});
  clamp(c);const s=sim(c)[key];if(s>bs){bs=s;best=c}
 }
 bestCfg=best;const u={maxH:"m",range:"m",maxV:"m/s"}[key],lab={maxH:"Maximum height",range:"Range",maxV:"Maximum velocity"}[key];
 const rows=[["Pressure",best.p.toFixed(1)+" bar"],["Water volume",best.vw.toFixed(2)+" L"],["Bottle volume",best.vt.toFixed(2)+" L"],["Dry mass",best.ms.toFixed(2)+" kg"],["Nozzle diameter",best.dn.toFixed(1)+" mm"],["Rocket diameter",best.dr.toFixed(0)+" mm"],["Cd",best.cd.toFixed(2)],["Launch angle",best.th.toFixed(0)+"°"]];
 $("best").innerHTML="<b>Best configuration found</b>"+rows.map(r=>`<div><span>${r[0]}:</span><span>${r[1]}</span></div>`).join("")+`<div><b>${lab}:</b><b>${bs.toFixed(1)} ${u}</b></div><button id="app" style="margin-top:6px;padding:5px 10px">Apply and launch</button>`;
 $("app").onclick=()=>{Object.assign(q,bestCfg);syncUI();launch()};
};
addEventListener("resize",()=>{if(cur){stats(cur);draw(cur.t.length-1,[])}else draw(0,[])});
$("hud").innerHTML="Ready to launch";draw(0,[]);launch();
</script></body></html>
